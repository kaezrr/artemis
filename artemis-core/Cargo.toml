[package]
name = "artemis"
version = "0.1.0"
edition = "2024"

[dependencies]
fastrand = { version = "2.4.1", optional = true }
futures = "0.3.32"
reqwest = "0.13.4"
sqlx = {
  version = "0.9.0",
  features = ["runtime-tokio", "sqlite"],
}
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
time = "0.3.51"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }

[features]
default = ["full"]
full = ["dep:fastrand"]
